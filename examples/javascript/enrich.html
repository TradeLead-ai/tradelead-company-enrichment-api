<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TradeLead API Browser Demo</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; max-width: 800px; margin: 40px auto; padding: 0 20px; line-height: 1.6; }
    .form-group { margin-bottom: 20px; }
    label { display: block; font-weight: bold; margin-bottom: 5px; }
    input[type="text"] { width: 100%; padding: 8px; box-sizing: border-box; }
    button { padding: 10px 15px; background: #0066cc; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; }
    button:disabled { background: #cccccc; cursor: not-allowed; }
    #status { margin-top: 20px; font-weight: bold; color: #555; }
    pre { background: #f4f4f4; padding: 15px; border-radius: 4px; overflow-x: auto; font-size: 14px; }
    .warning { background: #fff3cd; border-left: 4px solid #ffcc00; padding: 10px 15px; margin-bottom: 20px; }
  </style>
</head>
<body>

  <h1>TradeLead API Browser Demo</h1>
  
  <div class="warning">
    <strong>Note:</strong> This is a client-side demo. In a real application, you should never expose your API key in the browser. Call the TradeLead API from your backend server.
  </div>

  <form id="enrichForm">
    <div class="form-group">
      <label for="apiKey">API Key (tl_live_...):</label>
      <input type="text" id="apiKey" required placeholder="Enter your API key">
    </div>

    <div class="form-group">
      <label for="companyName">Company Name:</label>
      <input type="text" id="companyName" required value="Siemens AG" placeholder="e.g. Siemens AG">
    </div>

    <div class="form-group">
      <label for="country">Country (Optional):</label>
      <input type="text" id="country" value="Germany" placeholder="e.g. Germany">
    </div>

    <button type="submit" id="submitBtn">Enrich Company</button>
  </form>

  <div id="status"></div>
  <pre id="output" style="display: none;"></pre>

  <script>
    const sleep = (ms) => new Promise(r => setTimeout(r, ms));
    const BASE_URL = "https://data.tradelead.ai";

    document.getElementById("enrichForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      
      const apiKey = document.getElementById("apiKey").value.trim();
      const name = document.getElementById("companyName").value.trim();
      const country = document.getElementById("country").value.trim();
      
      const btn = document.getElementById("submitBtn");
      const statusEl = document.getElementById("status");
      const outputEl = document.getElementById("output");
      
      btn.disabled = true;
      outputEl.style.display = "none";
      
      const headers = {
        "X-API-Key": apiKey,
        "Content-Type": "application/json"
      };

      try {
        statusEl.textContent = "Submitting job...";
        
        // 1. Submit job
        const payload = { companies: [{ name, country }] };
        const submitResp = await fetch(`${BASE_URL}/v1/enrich`, {
          method: "POST",
          headers,
          body: JSON.stringify(payload)
        });

        if (!submitResp.ok) {
          const errText = await submitResp.text();
          throw new Error(`Submit failed: ${submitResp.status} ${errText}`);
        }

        const { job_id } = await submitResp.json();
        statusEl.textContent = `Job ${job_id} accepted. Waiting for results...`;

        // 2. Poll job
        while (true) {
          await sleep(3000); // Poll every 3 seconds
          
          const pollResp = await fetch(`${BASE_URL}/v1/enrich/jobs/${job_id}`, { headers });
          if (!pollResp.ok) {
            const errText = await pollResp.text();
            throw new Error(`Polling failed: ${pollResp.status} ${errText}`);
          }

          const result = await pollResp.json();
          
          if (result.status === "completed") {
            statusEl.textContent = "✅ Enrichment completed!";
            outputEl.textContent = JSON.stringify(result.results, null, 2);
            outputEl.style.display = "block";
            break;
          } else if (result.status === "failed") {
            throw new Error(`Job failed: ${result.error_message}`);
          } else {
            statusEl.textContent = `Status: ${result.status}... checking again.`;
          }
        }

      } catch (err) {
        statusEl.textContent = `❌ Error: ${err.message}`;
        statusEl.style.color = "red";
      } finally {
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
